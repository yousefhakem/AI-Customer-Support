spring:
  application:
    name: support-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/support}
    username: ${DATABASE_USERNAME:support}
    password: ${DATABASE_PASSWORD:support}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui
