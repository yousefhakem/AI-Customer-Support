spring:
  application:
    name: support-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/support}
    username: ${DATABASE_USERNAME:support}
    password: ${DATABASE_PASSWORD:support}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_JWT_ISSUER_DOMAIN}
          jwk-set-uri: ${CLERK_JWT_ISSUER_DOMAIN}/.well-known/jwks.json
          audiences: api
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui
